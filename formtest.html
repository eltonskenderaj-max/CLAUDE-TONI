<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test mail.php</title></head>
<body>
<h2>Test POST vers mail.php</h2>
<form id="f">
  <input name="name" value="Test Nom" placeholder="Nom"><br><br>
  <input name="email" value="contact@ahrpa.eu" placeholder="Email"><br><br>
  <input name="phone" value="0600000000" placeholder="Téléphone"><br><br>
  <input name="hotel" value="Hotel Test" placeholder="Hôtel"><br><br>
  <input name="rooms" value="20" placeholder="Chambres"><br><br>
  <textarea name="message">Message de test</textarea><br><br>
  <button type="submit">Envoyer</button>
</form>
<pre id="result" style="background:#eee;padding:1em;margin-top:1em"></pre>
<script>
document.getElementById('f').addEventListener('submit', async function(e) {
  e.preventDefault();
  document.getElementById('result').textContent = 'Envoi en cours...';
  try {
    const r = await fetch('/mail.php', {method:'POST', body: new FormData(this)});
    const text = await r.text();
    document.getElementById('result').textContent = 'Status HTTP: ' + r.status + '\n\nRéponse brute:\n' + text;
  } catch(err) {
    document.getElementById('result').textContent = 'ERREUR RESEAU: ' + err.message;
  }
});
</script>
</body>
</html>
