<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<br>
<button onclick="dl()">Télécharger og-image.jpg</button>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// Fond sombre
const bg = ctx.createLinearGradient(0, 0, 1200, 630);
bg.addColorStop(0, '#0D0C0A');
bg.addColorStop(1, '#1A1815');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, 1200, 630);

// Texture subtile
ctx.fillStyle = 'rgba(201,165,90,0.03)';
for(let i = 0; i < 1200; i += 4) {
  for(let j = 0; j < 630; j += 4) {
    if(Math.random() > 0.5) ctx.fillRect(i, j, 2, 2);
  }
}

// Cercle décoratif
ctx.strokeStyle = 'rgba(201,165,90,0.15)';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.arc(600, 315, 280, 0, Math.PI * 2);
ctx.stroke();

ctx.strokeStyle = 'rgba(201,165,90,0.08)';
ctx.beginPath();
ctx.arc(600, 315, 340, 0, Math.PI * 2);
ctx.stroke();

// Logo cercle AH
ctx.strokeStyle = '#C9A55A';
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(600, 220, 80, 0, Math.PI * 2);
ctx.stroke();

// Lettres AH dans le cercle
ctx.fillStyle = '#C9A55A';
ctx.font = 'bold 70px Georgia, serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('AH', 600, 222);

// AHRPA
const grad = ctx.createLinearGradient(400, 330, 800, 380);
grad.addColorStop(0, '#C9A55A');
grad.addColorStop(0.5, '#D4B878');
grad.addColorStop(1, '#C9A55A');
ctx.fillStyle = grad;
ctx.font = 'bold 96px Georgia, serif';
ctx.letterSpacing = '0.2em';
ctx.textAlign = 'center';
ctx.fillText('AHRPA', 600, 360);

// Sous-titre
ctx.fillStyle = 'rgba(201,165,90,0.7)';
ctx.font = '22px Arial, sans-serif';
ctx.fillText('ACCES HOTELS REVENUE PERFORMANCE ARRAY', 600, 415);

// Ligne décorative
ctx.strokeStyle = 'rgba(201,165,90,0.4)';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(300, 445);
ctx.lineTo(900, 445);
ctx.stroke();

// Tagline
ctx.fillStyle = 'rgba(245,239,230,0.6)';
ctx.font = '18px Arial, sans-serif';
ctx.fillText('Revenue Management · Albanie · ahrpa.eu', 600, 480);

function dl() {
  const link = document.createElement('a');
  link.download = 'og-image.jpg';
  link.href = c.toDataURL('image/jpeg', 0.95);
  link.click();
}
</script>
</body>
</html>
